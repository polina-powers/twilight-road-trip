name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          rm index.html
          git mv twilight-road-trip-forks-edition.html index.html
          git config user.name "polina-powers"
          git config user.email "polina-powers@users.noreply.github.com"
          git commit -m "Add four booked stays: Harbor Inn, Adobe Resort, Cannery Pier, Lithia Springs"
          git push
